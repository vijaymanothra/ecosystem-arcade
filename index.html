<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Ecosystem Arcade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0820; }
  #arcade { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <!-- The home screen and every game load inside this frame. This page never navigates,
       so fullscreen (which browsers drop on page changes) stays on while players switch games. -->
  <iframe id="arcade" src="home.html" allow="fullscreen; autoplay" allowfullscreen title="The Ecosystem Arcade"></iframe>
  <script>
  (() => {
    const frame = document.getElementById('arcade');
    const root = document.documentElement;
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    const tell = () => { try { frame.contentWindow.postMessage({ eaFullscreenState: !!fsElement() }, '*'); } catch { /* ignore */ } };

    addEventListener('message', (e) => {
      if (e.source !== frame.contentWindow || !e.data || !e.data.eaFullscreen) return;
      if (e.data.eaFullscreen === 'enter' && !fsElement()) {
        const req = root.requestFullscreen || root.webkitRequestFullscreen;
        try { const p = req.call(root, { navigationUI: 'hide' }); if (p && p.catch) p.catch(tell); } catch { tell(); }
      } else if (e.data.eaFullscreen === 'exit' && fsElement()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        tell();
      }
    });
    document.addEventListener('fullscreenchange', tell);
    document.addEventListener('webkitfullscreenchange', tell);
    frame.addEventListener('load', () => { tell(); frame.focus(); });
  })();
  </script>
</body>
</html>
