<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Ecosystem Arcade</title>
<link rel="stylesheet" href="shared/launcher.css">
</head>
<body>
  <div id="bg" class="bg" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="toast" hidden></div>

  <header class="brand">
    <div class="kicker">THE CIGNA GROUP · EMPLOYEE BOOTH</div>
    <h1>THE ECOSYSTEM ARCADE</h1>
    <p>5 games · 10 businesses · 1 passport — <b>tap a game to play!</b></p>
  </header>

  <main id="tiles" class="tiles"></main>

  <footer class="bottom">
    <section id="passportPanel" class="panel passport"></section>
    <section id="champsPanel" class="panel champs">
      <div class="champs-head">
        <h2>🏆 Today's Champions</h2>
        <div id="champDots" class="champ-dots"></div>
      </div>
      <div id="champGame" class="champ-game"></div>
      <div class="champ-timer" aria-hidden="true"><i></i></div>
      <ol id="champs"></ol>
    </section>
    <section class="panel experts">
      <h2>🌟 Ecosystem Experts</h2>
      <div id="experts" class="expert-list"></div>
      <div id="issued" class="issued"></div>
    </section>
  </footer>

  <!-- SIGN-IN -->
  <div id="signin" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <div class="pp-cover">📮</div>
        <div>
          <h2>Get your Evernorth Passport</h2>
          <p>Collect a stamp from every game today. All 5 = <b>Ecosystem Expert!</b></p>
        </div>
      </div>
      <div class="label">TYPE YOUR FIRST NAME</div>
      <div id="nameBox" class="name-box"></div>
      <div id="keys" class="keys"></div>
      <div class="sheet-actions">
        <button id="guestBtn" class="ghost" type="button">Play as guest</button>
        <button id="cancelBtn" class="ghost" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="shared/passport.js"></script>
  <script src="shared/config.js"></script>
  <script src="shared/leaderboard.js"></script>
  <script src="shared/launcher.js"></script>
  <script src="shared/fullscreen.js"></script>
</body>
</html>
