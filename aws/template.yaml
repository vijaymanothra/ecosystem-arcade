# ============================================================
#  ECOSYSTEM ARCADE on AWS
#    Players ─► CloudFront ─┬─ /*      ─► S3 bucket (the games)
#                           └─ /api/*  ─► API Gateway ─► Lambda ─► DynamoDB (scores)
#  Deploy with:  npm run aws:deploy        (see aws/README section in the main README)
# ============================================================
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ecosystem Arcade - games on S3 + CloudFront, scores API on API Gateway + Lambda + DynamoDB

Parameters:
  AdminToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Token for wiping scores (DELETE /api/scores). The deploy script generates and keeps it.
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret CloudFront sends to the API so it can't be called directly.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Sites allowed to call the API from a browser, comma separated.
  UseCloudFront:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      false = no S3 bucket or CloudFront; Lambda serves the games too, at the API Gateway address
      (for accounts not yet verified for CloudFront). Switch to true later with a normal deploy.

Conditions:
  WithCloudFront: !Equals [!Ref UseCloudFront, 'true']

Resources:
  # ---------------------------------------------------------------- scores
  ScoresTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # removing the stack keeps the scores; delete the table by hand if you're sure
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: gameDay, AttributeType: S }
        - { AttributeName: game, AttributeType: S }
        - { AttributeName: score, AttributeType: N }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: byDay           # today's top scores for one game
          KeySchema:
            - { AttributeName: gameDay, KeyType: HASH }
            - { AttributeName: score, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: byGame          # all-time top scores for one game
          KeySchema:
            - { AttributeName: game, KeyType: HASH }
            - { AttributeName: score, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true   # restore the table to any second in the last 35 days

  ScoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ScoresTable
          ADMIN_TOKEN: !Ref AdminToken
          ORIGIN_SECRET: !If [WithCloudFront, !Ref OriginSecret, '']
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SERVE_SITE: !If [WithCloudFront, '0', '1']
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ScoresApi

  ScoresFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ScoresFunction}
      RetentionInDays: 14

  ScoresApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:          # a ceiling for the whole API; CloudFront answers most reads before they get here
        ThrottlingRateLimit: 100
        ThrottlingBurstLimit: 200

  # ---------------------------------------------------------------- the games
  SiteBucket:
    Type: AWS::S3::Bucket
    Condition: WithCloudFront
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: WithCloudFront
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadsTheGames
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: false

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: WithCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # /route-rush/ → /route-rush/index.html, and /route-rush → /route-rush/
  FolderIndex:
    Type: AWS::CloudFront::Function
    Condition: WithCloudFront
    Properties:
      Name: !Sub ${AWS::StackName}-folder-index
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for folder addresses
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          if (uri.endsWith('/')) {
            req.uri = uri + 'index.html';
          } else if (uri.substring(uri.lastIndexOf('/') + 1).indexOf('.') === -1) {
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: uri + '/' } } };
          }
          return req;
        }

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: WithCloudFront
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-api
        Comment: Score lists are cached for the few seconds the API asks for; nothing else is
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 10
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: WithCloudFront
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${AWS::StackName}-api
        Comment: What the scores API needs from each request
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Content-Type
            - Origin
            - Access-Control-Request-Method
            - Access-Control-Request-Headers
            - CloudFront-Viewer-Address
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: WithCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Ecosystem Arcade
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${ScoresApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FolderIndex.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy

Outputs:
  SiteUrl:
    Description: The arcade
    Value: !If
      - WithCloudFront
      - !Sub https://${Distribution.DomainName}
      - !Sub https://${ScoresApi}.execute-api.${AWS::Region}.amazonaws.com
  UsesCloudFront:
    Value: !Ref UseCloudFront
  DistributionId:
    Condition: WithCloudFront
    Value: !Ref Distribution
  SiteBucketName:
    Condition: WithCloudFront
    Value: !Ref SiteBucket
  ScoresTableName:
    Value: !Ref ScoresTable
